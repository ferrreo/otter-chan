# Coolify: add this repo as a "Docker Compose" resource. Set OTTER_TOKENS and META_MODEL_API_KEY in
# the Coolify environment, then give the `tarquin` service the domain https://bot.ferreo.dev:8480
# (Coolify's proxy terminates TLS; the robot connects to wss://bot.ferreo.dev/ws/device).
# Local: `cp .env.example .env && docker compose -f docker-compose.yml -f docker-compose.local.yml up --build`.
services:
  tarquin:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    expose:
      - "8480"
    # Local (no proxy): docker compose -f docker-compose.yml -f docker-compose.local.yml up
    environment:
      OTTER_TOKENS: ${OTTER_TOKENS:?set device:<token>,<bot>:<token> in Coolify}
      META_MODEL_API_KEY: ${META_MODEL_API_KEY:?Meta Model API key (Muse Code plan key works)}
      OTTER_LLM_MODEL: ${OTTER_LLM_MODEL:-muse-spark-1.3-contributor}
      OTTER_LLM_REASONING: ${OTTER_LLM_REASONING:-minimal}
      OTTER_NAME: ${OTTER_NAME:-Tarquin}
      OTTER_WAKE_PHRASES: ${OTTER_WAKE_PHRASES:-tarquin,hey tarquin,ok tarquin}
      # TTS: piper (fast native, default) or vox (Audio8 zero-shot clone; slow without a strong GPU)
      OTTER_TTS_ENGINE: ${OTTER_TTS_ENGINE:-piper}
      OTTER_PIPER_MODEL: ${OTTER_PIPER_MODEL:-/opt/piper/voices/en_GB-northern_english_male-medium.onnx}
      OTTER_PIPER_SPEED: ${OTTER_PIPER_SPEED:-1.0}
      OTTER_VOX_VOICE: ${OTTER_VOX_VOICE:-tarquin}
      # Vulkan on the host's Intel/AMD GPU via /dev/dri (mesa ANV/RADV in the image). Set
      # OTTER_VOX_ARGS="--cpu --cpu-threads 8" to run without a GPU.
      OTTER_VOX_ARGS: ${OTTER_VOX_ARGS:---backend vulkan --gpu auto}
      OTTER_FOLLOWUP: ${OTTER_FOLLOWUP:-true}
      OTTER_STT_URL: http://stt:8080
    volumes:
      - tarquin-data:/data
    depends_on:
      - stt
    devices:
      - /dev/dri:/dev/dri
    # GID of the host's `render` group (getent group render | cut -d: -f3); needed for /dev/dri access.
    group_add:
      - "${RENDER_GID:-992}"
      - "${VIDEO_GID:-44}"

  stt:
    image: ghcr.io/mudler/parakeet.cpp-server:latest
    restart: unless-stopped
    command: ["--model", "${OTTER_STT_MODEL:-tdt_ctc-110m}"]
    environment:
      PARAKEET_CACHE_DIR: /cache
    volumes:
      - parakeet-cache:/cache
    expose:
      - "8080"

volumes:
  tarquin-data:
  parakeet-cache:
