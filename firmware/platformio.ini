; Otter-chan firmware — M5Stack StackChan (CoreS3, ESP32-S3)
; Build:  pio run
; Flash:  pio run -t upload
; Serial: pio device monitor

[platformio]
default_envs = otter
extra_configs = secrets.ini   ; optional: compile-time WiFi/server defaults (gitignored)

[env:otter]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
upload_speed = 1500000
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
extra_scripts = upload_models.py     ; adds `pio run -t upload_models`

board_build.partitions = esp_sr_16.csv   ; app0/app1 3 MB each + `model` partition for ESP-SR
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DWEBSOCKETS_NETWORK_TYPE=NETWORK_ESP32
    -DOTTER_FW_VERSION=\"0.1.0\"
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    m5stack/M5Unified @ ^0.2.21
    https://github.com/m5stack/StackChan-BSP.git
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    https://github.com/m5stack/M5Unit-NFC.git
    links2004/WebSockets @ ^2.6.1
    bblanchon/ArduinoJson @ ^7.3.0
